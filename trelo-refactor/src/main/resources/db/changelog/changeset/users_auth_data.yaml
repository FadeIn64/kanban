databaseChangeLog:
  - changeSet:
      id: 1
      author: danila
      changes:
        - createTable:
            tableName: users_auth_data
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    foreignKeyName: fk_users_auth_data
                    references: users(id)
                    nullable: false
              - column:
                  name: username
                  type: text
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: text
                  constraints:
                    nullable: false
